<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Generation</title>
</head>
<body>
    <h1>Audio Generation</h1>

    <form action="/test_audio" method="POST">
        <label for="audio_prompt">Enter text to generate audio:</label><br>
        <textarea id="audio_prompt" name="audio_prompt" rows="4" cols="50" required></textarea><br><br>
        <select name="voice" id="voice">
            <option value="pNInz6obpgDQGcFmaJgB">Man</option>
            <option value="AZnzlk1XvdvUeBnXmlld">Woman</option>
        </select><br><br>
        <input type="submit" value="Generate Audio">
    </form>

    {% if audio_url %}
        <h2>Generated Audio:</h2>
        <audio controls>
            <source src="{{ audio_url }}" type="audio/mpeg">
        </audio>
    {% endif %}
    
    <br><br>
    <a href="/">Home</a>
</body>
</html>
