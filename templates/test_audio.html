<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Audio – StoryAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <span class="nav-brand">📖 StoryAI</span>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/test_text">Test Text</a>
            <a href="/test_image">Test Image</a>
            <a href="/test_audio">Test Audio</a>
        </div>
    </nav>

    <main class="container">
        <header class="hero">
            <h1>Test Audio Generation</h1>
            <p class="hero-sub">Convert any text to speech with ElevenLabs</p>
        </header>

        {% if error %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <div class="card form-card">
            <form action="/test_audio" method="POST">
                <div class="form-group">
                    <label for="audio_prompt">Text to narrate</label>
                    <textarea id="audio_prompt" name="audio_prompt" rows="5" required
                        placeholder="Paste or type any text to convert to audio…"></textarea>
                </div>
                <div class="form-group">
                    <label for="voice">Voice</label>
                    <select name="voice" id="voice">
                        <option value="pNInz6obpgDQGcFmaJgB">🧔 Man</option>
                        <option value="AZnzlk1XvdvUeBnXmlld">👩 Woman</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Generate Audio</button>
            </form>
        </div>

        {% if audio_url %}
        <div class="card" style="margin-top: 2rem;">
            <h2 style="margin-bottom: 1rem;">🎧 Generated Audio</h2>
            <audio controls style="width: 100%;">
                <source src="{{ audio_url }}" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
        {% endif %}
    </main>

</body>
</html>
