<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StoryAI</title>
</head>
<body>
    <nav>
        <a href="/">Home</a><br>
        <a href="/test_text">Test Text Generation</a><br>
        <a href="/test_image">Test Image Generation</a><br>
        <a href="/test_audio">Test Audio Generation</a><br>
    </nav>
    <h1>Story Generator</h1>
    <form action="/generate" method="POST">

        <label for="prompt">Write a description of the story: (Optional)</label><br>
        <textarea id="prompt" name="prompt" rows="4" cols="50"></textarea><br><br>

        <label>Select a category of the story</label><br>
        
        <select id="category" name="category">
            <option value="Random">Random</option>
            <option value="Animals stories">Animals stories</option>
            <option value="Comedy">Comedy</option>
            <option value="Educational">Educational</option>
            <option value="Sci-fi">Sci-fi</option>
            <option value="Mystery">Mystery</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Adventure">Adventure</option>
        </select><br><br>

        <label for="length">Choose story length:</label><br>
        <select id="length" name="length">
            <option value="200">Short</option>
            <option value="450">Medium</option>
            <option value="800">Long</option>
        </select><br><br>

        <label for="moral">Enter a moral: (Optional)</label><br>
        <textarea name="moral" id="moral" rows="2" cols="50"></textarea><br><br>

        <input type="submit" value="Generate Story">
    </form>
    <div id="story">
        {% if story %}
            <h2>Generated Story:</h2>
            {% for paragraph, image in text_images %}
                <div>
                    <p>{{ paragraph }}</p>
                    <img src="{{image}}" alt="Generated image">
                </div>
            {% endfor %}

            <form id="audioForm" action="/generate_audio" method="post">
                <input type="hidden" name="story" value="{{ story }}">
                <button type="submit">Generate Audio</button>
            </form>
            <audio id="audioPlayer" controls></audio>
        
            <script>
                document.getElementById('audioForm').addEventListener('submit', async function(event) {
                    event.preventDefault();
                    const form = event.target;
                    const formData = new FormData(form);
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: formData
                    });
                    if (response.ok) {
                        const audioBlob = await response.blob();
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audioPlayer = document.getElementById('audioPlayer');
                        audioPlayer.src = audioUrl;
                        audioPlayer.play();
                    } else {
                        console.error('Failed to generate audio');
                    }
                });
            </script>
        {% endif %}
    </div>

</body>
</html>
